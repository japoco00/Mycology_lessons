<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Comparison of three fungal lifestyles: decomposer breaking down dead wood, mycorrhizal partner trading water and minerals for tree sugars, and parasite draining a living host">
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#28624d"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a65a2a"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#9a3428"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fbfaf6"/>

  <!-- Card 1: Decomposer -->
  <rect x="12" y="12" width="224" height="276" rx="8" fill="#ffffff" stroke="#d7ded6" stroke-width="1.5"/>
  <text x="26" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#28624d">1. Decomposer</text>
  <text x="26" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#52635c">Eats dead matter (saprobe)</text>

  <!-- Dead log -->
  <rect x="44" y="125" width="156" height="44" rx="14" fill="#d9cbb8" stroke="#7d6b57" stroke-width="1.8"/>
  <ellipse cx="44" cy="147" rx="10" ry="22" fill="#c7b59e" stroke="#7d6b57" stroke-width="1.8"/>
  <text x="122" y="151" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#4f4335">Dead wood / straw</text>

  <!-- Hyphae digesting log -->
  <g fill="none" stroke="#28624d" stroke-width="1.8" stroke-linecap="round">
    <path d="M 90 169 C 85 190, 65 205, 50 220"/>
    <path d="M 122 169 C 122 195, 118 210, 128 228"/>
    <path d="M 154 169 C 165 190, 180 205, 195 218"/>
    <path d="M 75 169 L 75 148 M 110 169 L 110 156 M 148 169 L 148 152" stroke-width="1.4" stroke-dasharray="2 2"/>
  </g>
  <!-- Small oyster shelf on log -->
  <path d="M 185 126 C 202 114, 218 120, 212 134 C 204 139, 192 136, 185 126 Z" fill="#e9ece8" stroke="#1d2925" stroke-width="1.4"/>

  <line x1="122" y1="106" x2="122" y2="122" stroke="#28624d" stroke-width="1.6" marker-end="url(#arr-g)"/>
  <text x="122" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#28624d">Breaks down cellulose &amp; lignin</text>

  <rect x="24" y="246" width="200" height="28" rx="5" fill="#edf3ee"/>
  <text x="124" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#28624d">Growable: feed it sawdust/straw</text>

  <!-- Card 2: Mycorrhizal -->
  <rect x="248" y="12" width="224" height="276" rx="8" fill="#ffffff" stroke="#d7ded6" stroke-width="1.5"/>
  <text x="262" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#28624d">2. Mycorrhizal partner</text>
  <text x="262" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#52635c">Trades with living plant roots</text>

  <!-- Sun + Tree canopy -->
  <circle cx="440" cy="78" r="10" fill="#e6b84c"/>
  <path d="M 360 66 L 328 110 L 392 110 Z" fill="#5c8a6b" stroke="#28624d" stroke-width="1.4"/>
  <rect x="355" y="110" width="10" height="32" fill="#8a6c50"/>
  <!-- Soil line -->
  <line x1="262" y1="142" x2="458" y2="142" stroke="#8a7f70" stroke-width="1.5"/>
  <!-- Tree roots -->
  <g fill="none" stroke="#8a6c50" stroke-width="2.5" stroke-linecap="round">
    <path d="M 360 142 C 350 160, 336 170, 326 180"/>
    <path d="M 360 142 C 360 164, 360 175, 360 186"/>
    <path d="M 360 142 C 370 160, 384 170, 394 180"/>
  </g>
  <!-- Fine extended fungal hyphae reaching much more soil -->
  <g fill="none" stroke="#28624d" stroke-width="1.4" stroke-linecap="round">
    <path d="M 326 180 C 300 190, 280 205, 266 225"/>
    <path d="M 326 180 C 316 205, 304 222, 294 236"/>
    <path d="M 360 186 C 352 210, 342 225, 338 238"/>
    <path d="M 360 186 C 370 210, 378 225, 384 238"/>
    <path d="M 394 180 C 415 196, 434 210, 452 226"/>
    <path d="M 394 180 C 406 204, 416 220, 424 236"/>
  </g>

  <!-- Trade arrows -->
  <line x1="312" y1="120" x2="312" y2="165" stroke="#a65a2a" stroke-width="1.8" marker-end="url(#arr-b)"/>
  <text x="304" y="135" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#a65a2a">Sugars</text>

  <line x1="412" y1="168" x2="412" y2="122" stroke="#28624d" stroke-width="1.8" marker-end="url(#arr-g)"/>
  <text x="418" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#28624d">Water &amp;</text>
  <text x="418" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#28624d">minerals</text>

  <rect x="260" y="246" width="200" height="28" rx="5" fill="#f6efe7"/>
  <text x="360" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#a65a2a">Hard to grow: needs living tree</text>

  <!-- Card 3: Parasite -->
  <rect x="484" y="12" width="224" height="276" rx="8" fill="#ffffff" stroke="#d7ded6" stroke-width="1.5"/>
  <text x="498" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#9a3428">3. Parasite</text>
  <text x="498" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#52635c">Takes from a living host</text>

  <!-- Living host trunk / tissue -->
  <rect x="546" y="88" width="54" height="128" rx="6" fill="#d9e3d5" stroke="#5c735a" stroke-width="1.8"/>
  <text x="573" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#3a4d39">Living</text>
  <text x="573" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#3a4d39">host</text>

  <!-- Parasitic hyphae invading -->
  <g fill="none" stroke="#9a3428" stroke-width="1.8" stroke-linecap="round">
    <path d="M 600 148 C 584 148, 574 156, 560 162"/>
    <path d="M 600 154 C 582 162, 570 174, 558 186"/>
    <path d="M 600 160 C 588 172, 580 185, 574 198"/>
  </g>
  <!-- Shelf fungus bracket -->
  <path d="M 600 142 C 632 135, 646 148, 636 162 C 624 167, 608 164, 600 156 Z" fill="#c77564" stroke="#6b231a" stroke-width="1.4"/>

  <line x1="612" y1="184" x2="656" y2="184" stroke="#9a3428" stroke-width="1.8" marker-end="url(#arr-r)"/>
  <text x="652" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#9a3428">One-way drain</text>
  <text x="652" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#52635c">(harms host)</text>

  <rect x="496" y="246" width="200" height="28" rx="5" fill="#f9ebe8"/>
  <text x="596" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#9a3428">Damages trees, crops, skin</text>
</svg>
