<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-label="Two graphs: top shows mushroom mycelium outrunning mould on pasteurized substrate with spawn versus losing to mould on unheated substrate with little spawn; bottom shows CO2 dropping sharply and humidity staying high when switching from colonization to fruiting">
  <rect width="720" height="390" fill="#fbfaf6"/>

  <!-- TOP PANEL: Turf war graphs -->
  <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1d2925">A. The colonization race: who claims the food first?</text>

  <!-- Subplot 1: Pasteurized + Spawn -->
  <rect x="16" y="34" width="336" height="156" rx="6" fill="#ffffff" stroke="#d7ded6" stroke-width="1.3"/>
  <text x="28" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#28624d">Pasteurized food + generous spawn</text>
  <!-- Axes -->
  <line x1="52" y1="68" x2="52" y2="162" stroke="#8a7f70" stroke-width="1.2"/>
  <line x1="52" y1="162" x2="334" y2="162" stroke="#8a7f70" stroke-width="1.2"/>
  <text x="46" y="74" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#52635c">100%</text>
  <text x="46" y="164" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#52635c">0%</text>
  <text x="192" y="179" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#52635c">Time (days)</text>
  <!-- Gridline 100% -->
  <line x1="52" y1="74" x2="334" y2="74" stroke="#edf0ec" stroke-width="1"/>
  <!-- Curves -->
  <path d="M 52 146 C 110 132, 160 80, 250 75 L 330 75" fill="none" stroke="#28624d" stroke-width="2.6"/>
  <path d="M 52 160 C 120 158, 220 158, 330 159" fill="none" stroke="#9a3428" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="180" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#28624d">Oyster mycelium wins</text>
  <text x="200" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9a3428">Mould suppressed</text>

  <!-- Subplot 2: Unheated + tiny spawn -->
  <rect x="368" y="34" width="336" height="156" rx="6" fill="#ffffff" stroke="#d7ded6" stroke-width="1.3"/>
  <text x="380" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#9a3428">Unheated food + tiny pinch of spawn</text>
  <!-- Axes -->
  <line x1="404" y1="68" x2="404" y2="162" stroke="#8a7f70" stroke-width="1.2"/>
  <line x1="404" y1="162" x2="686" y2="162" stroke="#8a7f70" stroke-width="1.2"/>
  <text x="398" y="74" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#52635c">100%</text>
  <text x="398" y="164" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#52635c">0%</text>
  <text x="544" y="179" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#52635c">Time (days)</text>
  <!-- Gridline 100% -->
  <line x1="404" y1="74" x2="686" y2="74" stroke="#edf0ec" stroke-width="1"/>
  <!-- Curves -->
  <path d="M 404 156 C 430 120, 460 80, 520 76 L 682 75" fill="none" stroke="#9a3428" stroke-width="2.6"/>
  <path d="M 404 160 C 440 155, 500 153, 682 153" fill="none" stroke="#28624d" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="488" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#9a3428">Wild mould claims food fast</text>
  <text x="520" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#28624d">Oyster stalled</text>

  <!-- BOTTOM PANEL: Fruiting switch chart -->
  <text x="16" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1d2925">B. The fruiting switch: what changes when mycelium reaches open air?</text>

  <rect x="16" y="226" width="688" height="150" rx="6" fill="#ffffff" stroke="#d7ded6" stroke-width="1.3"/>
  <!-- Phase shading -->
  <rect x="64" y="242" width="296" height="106" fill="#f7f5ef"/>
  <rect x="360" y="242" width="332" height="106" fill="#edf3ee" opacity="0.6"/>
  <line x1="360" y1="234" x2="360" y2="352" stroke="#1d2925" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Phase headers -->
  <text x="212" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#52635c">PHASE 1 · COLONIZATION (inside bag / log)</text>
  <text x="526" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#28624d">PHASE 2 · PINNING &amp; FRUITING (open air)</text>

  <!-- Axes -->
  <line x1="64" y1="264" x2="64" y2="348" stroke="#8a7f70" stroke-width="1.2"/>
  <line x1="64" y1="348" x2="692" y2="348" stroke="#8a7f70" stroke-width="1.2"/>
  <text x="58" y="274" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#52635c">High</text>
  <text x="58" y="346" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#52635c">Low</text>

  <!-- CO2 line: High during colonization, drops sharply at FAE -->
  <path d="M 68 276 L 340 276 C 358 276, 366 332, 392 334 L 686 334" fill="none" stroke="#1d2925" stroke-width="2.5"/>
  <text x="150" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1d2925">CO₂ trapped high (suppresses pins)</text>
  <text x="412" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1d2925">CO₂ drops with fresh air (pins form)</text>

  <!-- Air humidity line: kept high (85-95%) at fruiting -->
  <path d="M 68 318 L 352 318 C 368 318, 376 280, 400 278 L 686 278" fill="none" stroke="#28624d" stroke-width="2.3" stroke-dasharray="6 3"/>
  <text x="412" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#28624d">Air humidity 85–95% (pins don't dry out)</text>
  <text x="150" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#52635c">Moisture sealed inside substrate</text>

  <!-- Cue pill at transition -->
  <rect x="298" y="355" width="128" height="17" rx="4" fill="#1d2925"/>
  <text x="362" y="367" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">+ cool-down + light cue</text>
</svg>
